name: Executar ajustes v90

on:
  push:
    paths:
      - '.github/workflows/run-v90.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch_v90.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('Gestao_de_Projetos.html').read_text(encoding='utf-8')
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I),1): Path(f'/tmp/s{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/s*.js; do node --check "$f"; done
      - name: Commit
        run: |
          rm -f .github/workflows/run-v90.yml .github/patch_v90.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajustar paginação, popup e gráficos da visão geral"
          git push
