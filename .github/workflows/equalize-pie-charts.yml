name: Equalizar gráficos de divisão de projetos

on:
  push:
    paths:
      - '.github/workflows/equalize-pie-charts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Equalizar gráficos laterais
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('Gestao-de-Projetos.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
/* Equalização dos gráficos de divisão */
@media (min-width:1181px) {
  #ownerPieBody.pie-panel-body {
    display:grid !important;
    grid-template-columns:1fr !important;
    grid-template-rows:minmax(0,1fr) minmax(0,1fr) !important;
    align-content:stretch !important;
    gap:0 !important;
  }

  #ownerPieSection,
  #statusPieSection {
    min-height:0 !important;
    height:100% !important;
    box-sizing:border-box !important;
    display:grid !important;
    grid-template-columns:minmax(145px,165px) minmax(0,1fr) !important;
    grid-template-rows:auto 1fr !important;
    align-items:center !important;
    align-content:center !important;
    column-gap:16px !important;
    row-gap:8px !important;
    padding:18px 0 !important;
  }

  #ownerPieSection .pie-section-header,
  #statusPieSection .pie-section-header {
    grid-column:1 / -1 !important;
    margin:0 !important;
  }

  #ownerPieSection .pie-chart-wrap-compact,
  #statusPieSection .pie-chart-wrap-compact {
    width:165px !important;
    height:180px !important;
    min-height:180px !important;
    display:grid !important;
    place-items:center !important;
    justify-self:center !important;
    align-self:center !important;
  }

  #ownerPieChart,
  #statusPieChart {
    width:150px !important;
    height:150px !important;
    min-width:150px !important;
    min-height:150px !important;
    max-width:150px !important;
    max-height:150px !important;
    aspect-ratio:1 / 1 !important;
  }

  #ownerPieSection .pie-section-side,
  #statusPieSection .pie-section-side {
    width:100% !important;
    max-width:none !important;
    align-self:center !important;
  }

  #statusPieSection {
    border-top:1px solid rgba(59,163,201,.18) !important;
  }
}

body[data-theme="light"] #statusPieSection {
  border-top-color:rgba(55,145,183,.20) !important;
}
'''

          if '/* Equalização dos gráficos de divisão */' not in html:
              idx = html.rfind('</style>')
              if idx < 0:
                  raise SystemExit('Não foi possível localizar </style>.')
              html = html[:idx] + '\n' + css + '\n' + html[idx:]

          path.write_text(html, encoding='utf-8')
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          html=Path('Gestao-de-Projetos.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          for i,s in enumerate(scripts):
              Path(f'/tmp/script_{i}.js').write_text(s, encoding='utf-8')
          print(f'{len(scripts)} scripts extraídos')
          PY
          for f in /tmp/script_*.js; do node --check "$f"; done

      - name: Commitar ajuste
        shell: bash
        run: |
          rm -f .github/workflows/equalize-pie-charts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Equalizar tamanho dos gráficos de divisão"
          git push
