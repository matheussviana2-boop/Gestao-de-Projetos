name: Ajustar visual do calendário

on:
  push:
    paths:
      - '.github/workflows/calendar-visual-refine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar ajustes visuais do calendário
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('Gestao-de-Projetos.html')
          html = path.read_text(encoding='utf-8')
          css = base64.b64decode('').decode('utf-8')
          if '/* Refinamento visual do calendário */' not in html:
              idx = html.rfind('</style>')
              if idx < 0:
                  raise SystemExit('Não foi possível localizar </style>.')
              html = html[:idx] + '\n' + css + '\n' + html[idx:]
          path.write_text(html, encoding='utf-8')
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('Gestao-de-Projetos.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          for i, script in enumerate(scripts):
              Path(f'/tmp/script_{i}.js').write_text(script, encoding='utf-8')
          print(f'{len(scripts)} scripts extraídos')
          PY
          for f in /tmp/script_*.js; do node --check "$f"; done

      - name: Commitar ajuste
        shell: bash
        run: |
          rm -f .github/workflows/calendar-visual-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refinar visual do calendário"
          git push
