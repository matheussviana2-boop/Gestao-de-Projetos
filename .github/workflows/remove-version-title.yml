name: Remove version from browser title

on:
  push:
    paths:
      - '.github/workflows/remove-version-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar título
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('Gestao-de-Projetos.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('<title>CSC Gestão de Projetos | v94</title>', '<title>CSC Gestão de Projetos</title>', 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commitar
        shell: bash
        run: |
          rm -f .github/workflows/remove-version-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remover versão do título da aba"
          git push
