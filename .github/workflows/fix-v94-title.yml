name: Fix v94 title
on:
  push:
    paths:
      - .github/workflows/fix-v94-title.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "from pathlib import Path; p=Path('Gestao-de-Projetos.html'); h=p.read_text(encoding='utf-8').replace('CSC Gestço de Projetos | v94','CSC Gestão de Projetos | v94'); p.write_text(h,encoding='utf-8')"
          rm -f .github/workflows/fix-v94-title.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Corrigir título da v94'
          git push
