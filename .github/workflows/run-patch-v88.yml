name: Run patch v88
on:
  push:
    paths:
      - '.github/workflows/run-patch-v88.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch_timeline_v88.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('Gestao_de_Projetos.html').read_text(encoding='utf-8')
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I),1):
              Path(f'/tmp/s{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/s*.js; do node --check "$f"; done
      - run: |
          rm -f .github/workflows/run-patch-v88.yml .github/workflows/apply-timeline-v88.yml .github/patch_timeline_v88.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganizar próximas entregas e histórico concluído"
          git push
