name: Validar painel Diretoria

on:
  push:
    paths:
      - '.github/workflows/fix-directoria-status.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir referência do filtro de status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Diretoria.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('id="status"><option', 'id="statusFilter"><option')
          s = s.replace('status.innerHTML=', 'statusFilter.innerHTML=')
          s = s.replace('s=status.value', 's=statusFilter.value')
          s = s.replace('[q,area,status].forEach', '[q,area,statusFilter].forEach')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Diretoria.html').read_text(encoding='utf-8')
          code=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          Path('/tmp/diretoria.js').write_text(code,encoding='utf-8')
          PY
          node --check /tmp/diretoria.js
      - name: Salvar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Diretoria.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validar painel da Diretoria"
          git push
