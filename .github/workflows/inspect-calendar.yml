name: Inspect calendar code v92
on:
  push:
    paths:
      - '.github/workflows/inspect-calendar.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar trechos do calendario
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path('Gestao_de_Projetos.html').read_text(encoding='utf-8')
          needles = [
            '.gantt-', 'ganttGrid', 'renderGantt', 'calendarYear',
            'calendar-year-select', 'Calendário', 'calendar-status',
            'gantt-project', 'gantt-row', 'sem data definida'
          ]
          lines = text.splitlines()
          seen=[]
          for needle in needles:
              print('\n===== NEEDLE:', needle, '=====')
              count=0
              for i,line in enumerate(lines):
                  if needle.lower() in line.lower():
                      a=max(0,i-28); b=min(len(lines),i+80)
                      key=(a,b)
                      if key in seen: continue
                      seen.append(key)
                      print(f'--- linhas {a+1}-{b} ---')
                      for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
                      count += 1
                      if count >= 5: break
          PY
