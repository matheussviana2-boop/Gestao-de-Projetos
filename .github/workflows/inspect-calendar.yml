name: Ajustar legendas dos graficos
on:
  push:
    paths:
      - '.github/workflows/inspect-calendar.yml'
permissions:
  contents: write
jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar legendas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('Gestao-de-Projetos.html')
          s = p.read_text(encoding='utf-8')
          css = '''
          /* Nomes completos nas legendas dos graficos */
          @media (min-width:1181px) {
            #ownerPieSection .pie-legend-item,
            #statusPieSection .pie-legend-item {
              grid-template-columns:10px minmax(0,1fr) auto !important;
              justify-content:stretch !important;
              column-gap:8px !important;
            }
            #ownerPieSection .pie-legend-name,
            #statusPieSection .pie-legend-name {
              max-width:none !important;
              width:auto !important;
              white-space:normal !important;
              overflow:visible !important;
              text-overflow:clip !important;
              line-height:1.2 !important;
              overflow-wrap:anywhere !important;
            }
            #ownerPieSection .pie-legend-value,
            #statusPieSection .pie-legend-value {
              min-width:auto !important;
              white-space:nowrap !important;
            }
          }
          '''
          if '/* Nomes completos nas legendas dos graficos */' not in s:
              pos = s.rfind('</style>')
              if pos < 0:
                  raise SystemExit('style final nao encontrado')
              s = s[:pos] + css + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validar JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('Gestao-de-Projetos.html','utf8');
          const blocks = [...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
          blocks.forEach((b,i) => { fs.writeFileSync(`/tmp/legend-${i}.js`, b); require('child_process').execFileSync('node',['--check',`/tmp/legend-${i}.js`],{stdio:'inherit'}); });
          console.log(`JavaScript OK: ${blocks.length} blocos`);
          NODE
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gestao-de-Projetos.html
          git commit -m "Exibir nomes completos nas legendas dos graficos" || exit 0
          git push
