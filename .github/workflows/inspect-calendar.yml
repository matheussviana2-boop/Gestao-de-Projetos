name: Aplicar correcoes frontend

on:
  push:
    paths:
      - '.github/workflows/inspect-calendar.yml'
      - '.github/scripts/patch_notifications.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 .github/scripts/patch_notifications.py
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('Gestao-de-Projetos.html').read_text(encoding='utf-8')
          for i, code in enumerate(re.findall(r'<script[^>]*>([\s\S]*?)</script>', s)):
              Path(f'/tmp/csc-{i}.js').write_text(code, encoding='utf-8')
          PY
          for f in /tmp/csc-*.js; do node --check "$f"; done
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gestao-de-Projetos.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir atualizacoes, notificacoes e nomes"
          git push
