name: Patch resumo v94
on:
  push:
    paths:
      - .github/workflows/patch-v94-clean.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: echo '' | base64 -d | python
      - name: Validate JS
        run: |
          python -c "from pathlib import Path; import re; h=Path('Gestao-de-Projetos.html').read_text(encoding='utf-8'); [Path('/tmp/s%d.js'%i).write_text(s,encoding='utf-8') for i,s in enumerate(re.findall(r'<script[^>]*>([\\s\\S]*?)</script>',h))]"
          for f in /tmp/s*.js; do node --check "$f"; done
      - name: Commit
        run: |
          rm -f .github/workflows/patch-v94-clean.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refinar resumo de projetos na visão geral'
          git push
